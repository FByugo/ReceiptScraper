[project]
name = "receipt-scraper"
version = "1.0.0"
description = "Pull public web pages into a CSV and keep a checkable receipt for every page."
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
receipt-scraper = "receipt_scraper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["receipt_scraper"]
